name: Recovery certificate archive and privacy test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-certificate-vault
  cancel-in-progress: false
jobs:
  certificates:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/certificate-vault'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install recovery schema client
        run: python -m pip install 'psycopg[binary]==3.2.10'
      - name: Apply additive certificate schema to recovery only
        env:
          RECOVERY_DB_URL: ${{ secrets.RECOVERY_DB_URL }}
        run: python scripts/recovery-certificate-schema.py
      - name: Install cloud browser
        run: |
          npm install --prefix "$RUNNER_TEMP/certificate-browser" --no-save --package-lock=false playwright@1.56.1
          if command -v google-chrome >/dev/null; then
            echo 'CERTIFICATE_BROWSER_CHANNEL=chrome' >> "$GITHUB_ENV"
          else
            node "$RUNNER_TEMP/certificate-browser/node_modules/playwright/cli.js" install --with-deps chromium
          fi
      - name: Verify certificate archive and privacy on recovery only
        env:
          RECOVERY_SERVICE_ROLE_KEY: ${{ secrets.RECOVERY_SERVICE_ROLE_KEY }}
          CERTIFICATE_PLAYWRIGHT_MODULE: ${{ runner.temp }}/certificate-browser/node_modules/playwright/index.mjs
        run: node scripts/recovery-certificates.mjs
