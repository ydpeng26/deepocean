name: Recovery PC profile background test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-pc-profile
  cancel-in-progress: false
jobs:
  profile:
    if: github.ref == 'refs/heads/codex/pc-layout-keyboard-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install cloud browser
        run: |
          npm install --prefix "$RUNNER_TEMP/profile-browser" --ignore-scripts --no-save --package-lock=false playwright@1.56.1
          node "$RUNNER_TEMP/profile-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify separate background avatar and exact fixture cleanup
        env:
          RECOVERY_SERVICE_ROLE_KEY: ${{ secrets.RECOVERY_SERVICE_ROLE_KEY }}
          RECOVERY_PLAYWRIGHT_MODULE: ${{ runner.temp }}/profile-browser/node_modules/playwright/index.mjs
        run: node scripts/recovery-profile-background.mjs
