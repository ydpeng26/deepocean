name: Recovery PC profile editor test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-pc-profile
  cancel-in-progress: false
jobs:
  profile:
    if: github.ref == 'refs/heads/codex/pc-privacy-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose privacy using generated recovery fixtures only
        env:
          RECOVERY_SERVICE_ROLE_KEY: ${{ secrets.RECOVERY_SERVICE_ROLE_KEY }}
        run: node scripts/recovery-privacy-audit.mjs
