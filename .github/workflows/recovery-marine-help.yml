name: Recovery marine help and sharing audit
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-marine-help
  cancel-in-progress: false
jobs:
  help-flow:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/marine-help-flow'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated cloud browser
        run: |
          npm install --prefix "$RUNNER_TEMP/marine-help-browser" --no-save --package-lock=false playwright@1.56.1
          if command -v google-chrome >/dev/null; then
            echo 'RECOVERY_BROWSER_CHANNEL=chrome' >> "$GITHUB_ENV"
          else
            node "$RUNNER_TEMP/marine-help-browser/node_modules/playwright/cli.js" install --with-deps chromium
          fi
      - name: Install recovery schema client
        run: python -m pip install 'psycopg[binary]==3.2.10'
      - name: Apply authorized sharing repair to recovery only
        env:
          RECOVERY_DB_URL: ${{ secrets.RECOVERY_DB_URL }}
        run: python scripts/recovery-marine-help-schema.py
      - name: Diagnose generated recovery help and sharing fixtures only
        env:
          RECOVERY_SERVICE_ROLE_KEY: ${{ secrets.RECOVERY_SERVICE_ROLE_KEY }}
          RECOVERY_PLAYWRIGHT_MODULE: ${{ runner.temp }}/marine-help-browser/node_modules/playwright/index.mjs
          MARINE_HELP_EXPECT_FIXED: 'true'
        run: node scripts/recovery-marine-help.mjs
