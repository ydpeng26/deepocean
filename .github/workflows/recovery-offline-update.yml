name: Recovery offline update lifecycle acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-offline-update
  cancel-in-progress: false
jobs:
  update-lifecycle:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/pc-layout-keyboard-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser and source transpiler
        run: |
          npm install --prefix "$RUNNER_TEMP/offline-browser" --no-save --package-lock=false playwright@1.56.1 typescript@5.8.3
          if command -v google-chrome >/dev/null; then
            echo 'RECOVERY_BROWSER_CHANNEL=chrome' >> "$GITHUB_ENV"
          else
            node "$RUNNER_TEMP/offline-browser/node_modules/playwright/cli.js" install --with-deps chromium
          fi
      - name: Read pinned historical worker for migration fixture
        run: git fetch --depth=1 origin 2afc408bea57dd426a1e2c1f5ea44611bb2290cc
      - name: Check isolated real lifecycle and recovery offline forms
        env:
          RECOVERY_PLAYWRIGHT_MODULE: ${{ runner.temp }}/offline-browser/node_modules/playwright/index.mjs
          RECOVERY_TYPESCRIPT_MODULE: ${{ runner.temp }}/offline-browser/node_modules/typescript/lib/typescript.js
        run: |
          node scripts/cloud-offline-update-lifecycle.mjs
          node scripts/recovery-offline-cache.mjs
