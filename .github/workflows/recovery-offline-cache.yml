name: Recovery real offline cache diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-offline-cache
  cancel-in-progress: false
jobs:
  offline-cache:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/pc-layout-keyboard-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser
        run: |
          npm install --prefix "$RUNNER_TEMP/offline-browser" --no-save --package-lock=false playwright@1.56.1
          if command -v google-chrome >/dev/null; then
            echo 'RECOVERY_BROWSER_CHANNEL=chrome' >> "$GITHUB_ENV"
          else
            node "$RUNNER_TEMP/offline-browser/node_modules/playwright/cli.js" install --with-deps chromium
          fi
      - name: Check recovery cache without credentials or backend writes
        env:
          RECOVERY_PLAYWRIGHT_MODULE: ${{ runner.temp }}/offline-browser/node_modules/playwright/index.mjs
        run: node scripts/recovery-offline-cache.mjs
