name: Recovery browser validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/recovery-browser.mjs
      - .github/workflows/recovery-browser.yml
permissions:
  contents: read
concurrency:
  group: recovery-browser-validation
  cancel-in-progress: false
jobs:
  browser:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test isolated deployed application
        env:
          RECOVERY_SERVICE_ROLE_KEY: ${{ secrets.RECOVERY_SERVICE_ROLE_KEY }}
        run: node scripts/recovery-browser.mjs
