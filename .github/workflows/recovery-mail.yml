name: Recovery confirmation mail
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-confirmation-mail
  cancel-in-progress: false
jobs:
  mail:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install cloud mail tools
        run: |
          python3 -m venv "$RUNNER_TEMP/mail-venv"
          "$RUNNER_TEMP/mail-venv/bin/pip" install boto3==1.40.54 requests==2.32.5
      - name: Send one isolated confirmation test
        env:
          RECOVERY_SERVICE_ROLE_KEY: ${{ secrets.RECOVERY_SERVICE_ROLE_KEY }}
          RECOVERY_SMTP_PASSWORD: ${{ secrets.RECOVERY_SMTP_PASSWORD }}
          RECOVERY_TEST_EMAIL: ${{ secrets.RECOVERY_TEST_EMAIL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: '"$RUNNER_TEMP/mail-venv/bin/python" scripts/recovery-mail.py'
