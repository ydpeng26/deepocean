name: Recovery PC profile editor branch test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-pc-account-switch
  cancel-in-progress: false
jobs:
  account-switch:
    if: github.ref == 'refs/heads/codex/pc-profile-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install cloud browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check profile editor on recovery only
        env:
          RECOVERY_SERVICE_ROLE_KEY: ${{ secrets.RECOVERY_SERVICE_ROLE_KEY }}
        run: node scripts/recovery-profile.mjs
