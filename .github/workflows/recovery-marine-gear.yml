name: Recovery marine and gear resilience
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-marine-gear
  cancel-in-progress: false
jobs:
  resilience:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/marine-gear-resilience' || github.ref == 'refs/heads/codex/marine-help-flow'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated cloud browser
        run: |
          npm install --prefix "$RUNNER_TEMP/resilience-browser" --no-save --package-lock=false playwright@1.56.1
          if command -v google-chrome >/dev/null; then
            echo 'RECOVERY_BROWSER_CHANNEL=chrome' >> "$GITHUB_ENV"
          else
            node "$RUNNER_TEMP/resilience-browser/node_modules/playwright/cli.js" install --with-deps chromium
          fi
      - name: Check synthetic marine and gear failures on recovery only
        env:
          RECOVERY_SERVICE_ROLE_KEY: ${{ secrets.RECOVERY_SERVICE_ROLE_KEY }}
          RECOVERY_PLAYWRIGHT_MODULE: ${{ runner.temp }}/resilience-browser/node_modules/playwright/index.mjs
        run: |
          if [ "$GITHUB_REF" = 'refs/heads/codex/marine-help-flow' ]; then
            node scripts/recovery-marine-help.mjs
          else
            node scripts/recovery-marine-gear.mjs
          fi
